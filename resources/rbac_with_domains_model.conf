[request_definition]
r = sub, dom, obj, act
r2 = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act
p2 = sub_rule, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))
e2 = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && r.act == p.act
m2 = eval(p2.sub_rule) && r2.dom == p2.dom && r2.obj == p2.obj && r2.act == p2.act
